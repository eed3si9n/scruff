[package]
name = "scruff"
version = "0.3.1"
edition = "2024"
description = "Scala code formatter"
license = "MIT"
repository = "https://github.com/eed3si9n/scruff"
readme = "README.md"
keywords = ["scala", "formatter"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["/corpora/", "/tmp/", "/PLAN.md", "/.devcontainer/", "/.github/", "/.gitmodules"]

[dependencies]
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.5", features = ["derive"] }
hocon-parser = "1.14.2"
ignore = "0.4"
rayon = "1.12"
regex = "1"
similar = "2.7"
text-size = "1.1.1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.1"
tree-sitter-scala = "0.26.9"

[profile.release]
strip = true
lto = true

# pprof only builds on Unix; `examples/profile.rs` is a stub elsewhere.
[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.15.0", features = ["flamegraph"] }

# Release with symbols, for `examples/profile.rs`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
