name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the Rust tests and builds, and the sbt plugin's tests,
  # need to run, so that changes only to docs skip them.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      plugin: ${{ steps.changes.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Tags and manual runs always build; so does a push with no usable base.
          base=""
          if [[ "$EVENT" == "pull_request" ]]; then
            base=$PR_BASE
          elif [[ "$EVENT" == "push" && "$REF" != refs/tags/* ]]; then
            base=$PUSH_BEFORE
          fi
          rust=true
          plugin=true
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] &&
             files=$(git diff --name-only "$base" HEAD); then
            echo "Changed files:"
            echo "$files"
            # Everything the Rust build and tests read, and this workflow.
            if ! grep -qE '^(src/|tests/|examples/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)' <<< "$files"; then
              rust=false
            fi
            # The plugin's tests run the scruff they build, so they also
            # run when the Rust code changes.
            if [[ "$rust" == false ]] &&
               ! grep -qE '^(plugin/|build\.sbt$|project/[^/]+\.(sbt|properties)$)' <<< "$files"; then
              plugin=false
            fi
          fi
          echo "rust=$rust plugin=$plugin"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Submodules (corpora/) are skipped: tests that use them skip when absent.
      - uses: actions/checkout@v7

      # Runs the defaults, `scruff format --check` and `scruff check`, on this repo.
      # - name: check Scala code format and lint
      # Skipped on Windows until a release keeps CRLF line endings.
      - if: runner.os != 'Windows'
        uses: ./
      - if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
      - if: needs.changes.outputs.rust == 'true'
        run: cargo test --locked

  # The sbt plugin's scripted tests, for sbt 2 and sbt 1, against the scruff
  # built here.
  plugin:
    name: Test sbt plugin
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The plugin's version, and the scruff it downloads by default,
          # come from the release tags.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt -v "clean; scripted"

  build:
    name: Build (${{ matrix.target }})
    needs: [changes, test]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` follows sbtn's naming (x86_64-pc-linux etc.).
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              name: x86_64-pc-linux,
            }
          - {
              os: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-musl,
              name: aarch64-pc-linux,
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              name: x86_64-pc-win32,
            }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static Linux binaries: musl-gcc compiles tree-sitter's C sources.
      - if: endsWith(matrix.target, '-musl')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: musl-tools # provides musl-gcc
          version: 1.0
      - if: endsWith(matrix.target, '-musl')
        run: |
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Tag builds use the tag (v0.1.0 -> 0.1.0); others use the short commit.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Package
        shell: bash
        run: |
          name=scruff-${{ matrix.name }}-$VERSION
          mkdir "$name"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/scruff.exe "$name/"
            cp LICENSE "$name/"
            7z a "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/${{ matrix.target }}/release/scruff "$name/"
            cp LICENSE "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: scruff-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  build-macos:
    name: Build (macOS)
    needs: [changes, test]
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Both targets are built on the ARM runner; x86_64 is cross-compiled.
      - run: cargo build --release --locked --target aarch64-apple-darwin --target x86_64-apple-darwin
      # Tag builds use the tag (v0.1.0 -> 0.1.0); others use the short commit.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Package
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/scruff \
            target/aarch64-apple-darwin/release/scruff \
            target/x86_64-apple-darwin/release/scruff
          lipo -info target/universal-apple-darwin/release/scruff
          for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            name=scruff-$target-$VERSION
            mkdir "$name"
            cp target/$target/release/scruff "$name/"
            cp LICENSE "$name/"
            tar czf "$name.tar.gz" "$name"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: scruff-macos
          path: scruff-*-apple-darwin-*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
